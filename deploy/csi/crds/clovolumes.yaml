apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clovolumes.storage.clo.rave-technology.io
spec:
  group: storage.clo.rave-technology.io
  scope: Namespaced
  names:
    plural: clovolumes
    singular: clovolume
    kind: CloVolume
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - installationID
            - projectID
            - csiName
            - fingerprint
            - providerName
            - requiredBytes
            - fsType
            - accessMode
            properties:
              initializationIntent:
                type: object
                required: [version, digest, status]
                properties:
                  version:
                    type: string
                    enum: [v1]
                  digest:
                    type: string
                    pattern: '^[a-f0-9]{64}$'
                  status:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              installationID:
                type: string
                format: uuid
              projectID:
                type: string
                format: uuid
              csiName:
                type: string
              fingerprint:
                type: string
              providerName:
                type: string
                maxLength: 63
              requiredBytes:
                type: integer
                format: int64
                minimum: 0
              limitBytes:
                type: integer
                format: int64
                minimum: 0
              fsType:
                type: string
                enum:
                - ext4
              accessMode:
                type: string
                enum:
                - SINGLE_NODE_WRITER
              pvcUID:
                type: string
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: Registry ownership spec is immutable
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              initialized:
                type: boolean
            required:
            - initialized
