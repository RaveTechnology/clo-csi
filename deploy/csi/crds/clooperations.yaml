apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clooperations.storage.clo.rave-technology.io
spec:
  group: storage.clo.rave-technology.io
  scope: Namespaced
  names:
    plural: clooperations
    singular: clooperation
    kind: CloOperation
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          spec:
            type: object
            required:
            - installationID
            - projectID
            - type
            - nonce
            - issuer
            - before
            properties:
              initializationIntent:
                type: object
                required: [version, digest, status]
                properties:
                  version:
                    type: string
                    enum: [v1]
                  digest:
                    type: string
                    pattern: '^[a-f0-9]{64}$'
                  status:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              installationID:
                type: string
                format: uuid
              projectID:
                type: string
                format: uuid
              type:
                type: string
                enum:
                - create
                - attach
                - detach
                - extend
                - delete
                - format
              nonce:
                type: string
              volumeRecordID:
                type: string
              nodeBindingID:
                type: string
              issuer:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              before:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              apiVolumeIDs:
                type: array
                items:
                  type: string
              deadline:
                type: string
              targetSizeGB:
                type: integer
                minimum: 0
              fenceID:
                type: string
              limitBytes:
                type: integer
                format: int64
                minimum: 0
            x-kubernetes-validations:
            - rule: self == oldSelf
              message: Registry ownership spec is immutable
          status:
            type: object
            x-kubernetes-preserve-unknown-fields: true
            properties:
              initialized:
                type: boolean
            required:
            - initialized
