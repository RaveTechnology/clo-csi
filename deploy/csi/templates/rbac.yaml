apiVersion: v1
kind: ServiceAccount
metadata: {name: clo-csi-controller, namespace: {{ .Release.Namespace }}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: clo-csi-node, namespace: {{ .Release.Namespace }}}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: clo-csi-registry, namespace: {{ .Release.Namespace }}}
rules:
  - apiGroups: [storage.clo.rave-technology.io]
    resources: [clovolumes, clonodebindings, clooperations, clofences, clocontrollerepochs]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [storage.clo.rave-technology.io]
    resources: [clovolumes/status, clonodebindings/status, clooperations/status, clofences/status, clocontrollerepochs/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [clo-csi-installation]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods, serviceaccounts]
    verbs: [get]
  - apiGroups: [apps]
    resources: [daemonsets]
    resourceNames: [clo-csi-node]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: clo-csi-registry, namespace: {{ .Release.Namespace }}}
subjects:
  - kind: ServiceAccount
    name: clo-csi-controller
    namespace: {{ .Release.Namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: clo-csi-registry}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: clo-csi-controller}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csinodes, csidrivers]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: clo-csi-controller}
subjects:
  - kind: ServiceAccount
    name: clo-csi-controller
    namespace: {{ .Release.Namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: clo-csi-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: clo-csi-operator, namespace: {{ .Release.Namespace }}}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [clo-csi-installation]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [clo-csi-controller]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
