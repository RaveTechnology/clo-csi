name: Checks and release
'on':
  push:
    branches:
    - main
    tags:
    - v*
  pull_request: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CLO_CSI_SANITY_LAB: ''
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
      with:
        go-version: 1.27.1
        cache: true
    - run: |-
        python3 -m venv .venv
        .venv/bin/pip install -r scripts/requirements-test.txt
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      name: Pinned Python test tools
    - run: |-
        curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
        curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
        sha256sum -c helm-v4.3.0-linux-amd64.tar.gz.sha256sum
        tar -xzf helm-v4.3.0-linux-amd64.tar.gz
        sudo install linux-amd64/helm /usr/local/bin/helm
      name: Helm 4.3.0 with checksum verification
    - run: make check
      name: Existing race and vet checks
    - run: |-
        case "$GITHUB_REF" in
          refs/tags/v*) version="$GITHUB_REF_NAME" ;;
          *) version="v$(cat VERSION)" ;;
        esac
        version="${version#v}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
      id: version
      name: Resolve release version
    - run: make package VERSION="${{ steps.version.outputs.version }}"
      name: Build checked release artifacts
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      with:
        name: release-files
        path: dist/*
        if-no-files-found: error
        retention-days: 7
  release:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-files
        path: dist
    - run: |-
        VERSION="${GITHUB_REF_NAME#v}"
        IMAGE="ghcr.io/ravetechnology/clo-csi"
        echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker buildx build --platform=linux/amd64 --provenance=false --build-arg SOURCE_DATE_EPOCH=0 --build-arg VERSION="$VERSION" --metadata-file dist/image-metadata.json --tag "$IMAGE:$VERSION" --push -f Dockerfile.csi .
        python3 scripts/image-reference.py "$IMAGE"
        gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease --latest=false --title "$GITHUB_REF_NAME — experimental" --notes-file RELEASE_NOTES.md dist/clo-csi-linux-amd64.tar.gz dist/clo-csi-*.tgz dist/SHA256SUMS dist/image-reference.txt dist/LICENSE dist/NOTICE dist/THIRD_PARTY_NOTICES.txt
      env:
        GH_TOKEN: ${{ github.token }}
      name: Publish experimental image and release
